services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeinsight-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: codeinsight
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 12345

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: